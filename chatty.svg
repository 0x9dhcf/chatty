<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

  <!-- Terminal bubble body -->
  <rect x="20" y="20" width="360" height="240" rx="16" fill="#1c1c1e"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="360" height="32" rx="16" fill="#2e2e2e"/>
  <rect x="20" y="36" width="360" height="16" fill="#2e2e2e"/>

  <!-- Traffic lights -->
  <circle cx="48" cy="36" r="6" fill="#FF5F57"/>
  <circle cx="68" cy="36" r="6" fill="#FFBD2E"/>
  <circle cx="88" cy="36" r="6" fill="#28C840"/>

  <!-- Bubble tail -->
