  <!-- Terminal lines -->
  <text x="40" y="100" font-family="monospace" font-size="14" fill="#7C6FF7">❯</text>
  <text x="58" y="100" font-family="monospace" font-size="14" fill="#e8e8e8">chatty</text>

  <text x="40" y="128" font-family="monospace" font-size="13" fill="#28C840">✦</text>
  <text x="58" y="128" font-family="monospace" font-size="13" fill="#a0a0a0">Hey! How can I help?</text>

  <text x="40" y="156" font-family="monospace" font-size="14" fill="#7C6FF7">❯</text>
  <rect x="58" y="145" width="9" height="14" rx="1" fill="#7C6FF7"/>
</svg>
